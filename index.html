
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Car Showroom</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .header { background: #222; color: white; padding: 20px; text-align: center; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
    .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 15px; }
    .card-body h3 { margin: 0; font-size: 18px; }
    .card-body p { margin: 5px 0; color: #555; }
    .btn { display: block; width: 100%; margin-top: 10px; padding: 10px; text-align: center; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">www.mycarshowroom.com</div>
  <div class="grid">
    <div class="card">
      <img src="https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg" />
      <div class="card-body">
        <h3>Toyota Camry</h3>
        <p>Sedan</p>
        <p>$24,000</p>
        <button class="btn">تفاصيل أكثر</button>
      </div>
    </div>
    <div class="card">
      <img src="https://images.pexels.com/photos/799443/pexels-photo-799443.jpeg" />
      <div class="card-body">
        <h3>Tesla Model X</h3>
        <p>Electric</p>
        <p>$89,000</p>
        <button class="btn">تفاصيل أكثر</button>
      </div>
    </div>
    <div class="card">
      <img src="https://images.pexels.com/photos/1402787/pexels-photo-1402787.jpeg" />
      <div class="card-body">
        <h3>BMW X5</h3>
        <p>SUV</p>
        <p>$60,000</p>
        <button class="btn">تفاصيل أكثر</button>
      </div>
    </div>
  </div>
</body>
</html>
